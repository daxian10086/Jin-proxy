[package]
name = "jin-proxy"
version = "1.0.0"
edition = "2024"
description = "Chat Completions + Responses API proxy for DeepSeek V4 (and compatible models)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
actix-web = "4"
actix-cors = "0.7"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "blocking"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
rustls = "0.23"
rustls-pemfile = "2"
rcgen = "0.13"
time = "0.3"
regex = "1"
lazy_static = "1.5"
log = "0.4"
env_logger = "0.11"
scraper = "0.22"
url = "2"
ipnet = "2"
tokio-rustls = "0.26"
bytes = "1"
futures-util = "0.3"
async-stream = "0.3"